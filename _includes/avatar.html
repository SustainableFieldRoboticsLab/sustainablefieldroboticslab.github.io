{% assign person = include.person %}
{% if person.photo2 and person.photo2 != "" %}<span class="avatar-flip"><img class="avatar" src="{{ person.photo | relative_url }}" alt="Portrait of {{ person.name }}" loading="lazy"><img class="avatar" src="{{ person.photo2 | relative_url }}" alt="Portrait of {{ person.name }}" loading="lazy"></span>{% elsif person.photo and person.photo != "" %}<img class="avatar{% if person.photo_class %} {{ person.photo_class }}{% endif %}" src="{{ person.photo | relative_url }}" alt="Portrait of {{ person.name }}" loading="lazy">{% else %}{% assign names = person.name | split: " " %}<span class="avatar avatar-initials" aria-hidden="true">{{ names.first | slice: 0 }}{{ names.last | slice: 0 }}</span>{% endif %}
