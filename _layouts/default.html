<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/logo.svg' | relative_url }}" type="image/svg+xml">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"ResearchOrganization","name":{{ site.data.lab.name | jsonify }},"alternateName":"SFRL","parentOrganization":{"@type":"CollegeOrUniversity","name":{{ site.data.lab.university | jsonify }}},"founder":{"@type":"Person","name":{{ site.data.people.director.name | jsonify }},"sameAs":[{{ site.data.lab.links.scholar | jsonify }},{{ site.data.lab.links.orcid | jsonify }}]}}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
