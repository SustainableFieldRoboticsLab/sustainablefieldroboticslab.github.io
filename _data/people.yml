director:
  name: Ranjan Sapkota
  role: Founding Director
  title: Assistant Professor of Field Robotics
  affiliation: Oregon State University · MIME
  photo: /assets/img/people/ranjan-sapkota.jpg
  keywords: [field robotics, machine vision, robotic manipulation, agentic AI]
  bio: >-
    Ranjan Sapkota is an Assistant Professor of Robotics (Currently holding a courtesy appointment; official tenure-track appointment begins January 2027) in the School of Mechanical, Industrial, and
    Manufacturing Engineering at Oregon State University. He completed PhD in Biological and Environmental
    Engineering at Cornell University, with a core research focused on Agricultural Robotics and Artificial
    Intelligence. His work joins field robotics, machine-learning, machine vision, robotic manipulation,
    precision agriculture, vision-language-action models, large language models, agentic AI systems,
    and agricultural sustainability.
  education:
    - PhD, Biological and Environmental Engineering, Cornell University (2025-2026); transferred from Washington State University (2022-2025)
    - MS, Agricultural and Biological Engineering, North Dakota State University (2022)
    - B.Tech, Electrical and Electronics Engineering, Uttarakhand Technical University, India (2019)
  awards:
    - AC High-Impact Paper Award, Agriculture Communications, Elsevier B.V. (2026; Beijing Academy of Agriculture and Forestry Sciences)
    - Outstanding Reviewer, ASABE Technical Communities (2025)
    - Arnie and Marta Kegel Fellowship, Washington State University (2024)
    - Three Minute Thesis winner, WSU Biological Systems Engineering (2024)
    - Finalist and 3rd place, ASABE Ethics Essay Competition (2024)
    - Sustainability Top 100 article of 2023, Scientific Reports
    - Most downloaded paper, Information Fusion (Elsevier)
    - Top cited paper, Artificial Intelligence in Agriculture (Elsevier)
    - Fan's Favorite, ASABE 1-Minute Video Competition (2021)
  links:
    scholar: https://scholar.google.com/citations?user=MDeMB7sAAAAJ&hl=en
    orcid: https://orcid.org/0000-0002-5417-6744
    linkedin: https://www.linkedin.com/in/ranjan-sapkota-069645118
    cv: ""

