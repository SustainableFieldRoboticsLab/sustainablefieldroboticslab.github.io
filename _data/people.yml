join:
  positions: [MS, PhD, Postdoc, Visiting Scholar]
  text: >-
    SFRL is seeking motivated MS and PhD students, postdoctoral scholars, and visiting scholars interested
    in sustainable field robotics, agricultural automation, machine perception, robotic manipulation,
    physical AI, and renewable-energy-aware autonomous systems. We welcome applicants from robotics,
    mechanical engineering, electrical and computer engineering, computer science, agricultural
    engineering, horticulture, and related fields.
  how: >-
    Email a CV, a short statement of interests, and links to relevant projects, code, or publications.
    Student admission and hiring remain subject to OSU and funding procedures.
  culture: >-
    We value careful field work, open science, and a lab where people from every background can do their
    best research. New members are mentored on experimental design, safe field deployment, and writing.
